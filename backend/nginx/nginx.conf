# Configuration Nginx pour BABYLONE Backend
# À placer dans /etc/nginx/sites-available/babylone-backend

upstream babylone_backend {
    # Load balancing entre plusieurs instances
    server localhost:3000;
    server localhost:3001 backup; # Serveur de secours
    # Ajouter plus de serveurs pour la scalabilité horizontale
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name api.babylone.cm;

    # Redirection Cloudflare (si utilisé)
    if ($http_cf_connecting_ip) {
        set_real_ip_from 0.0.0.0/0;
        real_ip_header CF-Connecting-IP;
    }

    # Rediriger vers HTTPS
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    server_name api.babylone.cm;

    # Certificats SSL (Let's Encrypt ou Cloudflare)
    ssl_certificate /etc/letsencrypt/live/api.babylone.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.babylone.cm/privkey.pem;
    
    # Configuration SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Limites de taille
    client_max_body_size 50M; # Pour les uploads de fichiers

    # Logs
    access_log /var/log/nginx/babylone-backend-access.log;
    error_log /var/log/nginx/babylone-backend-error.log;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req zone=api_limit burst=20 nodelay;

    # API principale
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://babylone_backend;
        proxy_http_version 1.1;
        
        # Headers pour le proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check (sans rate limiting)
    location /api/v1/health {
        proxy_pass http://babylone_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off; # Ne pas logger les health checks
    }

    # WebSocket pour le chat
    location /socket.io/ {
        proxy_pass http://babylone_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Timeouts plus longs pour WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Gestion des erreurs
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

